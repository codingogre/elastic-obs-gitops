name: pr

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  TF_STATE_REGION: ${{ secrets.TF_STATE_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  checks:
    name: fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -recursive -check -diff modules envs platform
      - name: terraform validate
        run: |
          for root in envs/dev envs/prod platform; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false >/dev/null
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done

  dev-plan:
    name: dev plan
    needs: checks
    # Same-repository pull requests only: forks get no secrets and no review.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: dev
      deployment: false
    env:
      ELASTICSEARCH_ENDPOINTS: ${{ secrets.ELASTICSEARCH_ENDPOINTS }}
      ELASTICSEARCH_API_KEY: ${{ secrets.ELASTICSEARCH_API_KEY }}
      KIBANA_ENDPOINT: ${{ secrets.KIBANA_ENDPOINT }}
      KIBANA_API_KEY: ${{ secrets.KIBANA_API_KEY }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      SN_URL: ${{ secrets.SN_URL }}
      SN_USER: ${{ secrets.SN_USER }}
      SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
      PD_ROUTING_KEY: ${{ secrets.PD_ROUTING_KEY }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tf-env
      - name: init
        run: python3 scripts/with_env.py dev --backend -- terraform -chdir=envs/dev init -input=false
      - name: plan
        run: python3 scripts/with_env.py dev -- terraform -chdir=envs/dev plan -input=false -lock=false -out=tfplan
      - name: redacted summary
        run: |
          terraform -chdir=envs/dev show -json tfplan > "$RUNNER_TEMP/plan.json"
          python3 scripts/plan_summary.py "$RUNNER_TEMP/plan.json" --title "Dev plan" > "$RUNNER_TEMP/plan.md"
          rm -f "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.md" >> "$GITHUB_STEP_SUMMARY"
      - name: comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/plan.md" --edit-last --create-if-none
