name: apply-prod

on:
  push:
    branches: [main]
    paths:
      - envs/prod/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tf-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  TF_STATE_REGION: ${{ secrets.TF_STATE_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  apply:
    # A merged promotion applies prod once prod is live (repository variable PROD_LIVE=true); on demand it always runs.
    if: github.event_name == 'workflow_dispatch' || vars.PROD_LIVE == 'true'
    runs-on: ubuntu-latest
    # The prod environment requires an approver and deploys only from main.
    environment: prod
    env:
      ELASTICSEARCH_ENDPOINTS: ${{ secrets.ELASTICSEARCH_ENDPOINTS }}
      ELASTICSEARCH_API_KEY: ${{ secrets.ELASTICSEARCH_API_KEY }}
      KIBANA_ENDPOINT: ${{ secrets.KIBANA_ENDPOINT }}
      KIBANA_API_KEY: ${{ secrets.KIBANA_API_KEY }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      SN_URL: ${{ secrets.SN_URL }}
      SN_USER: ${{ secrets.SN_USER }}
      SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
      PD_ROUTING_KEY: ${{ secrets.PD_ROUTING_KEY }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tf-env
        with:
          build-provider: "true"
      - name: init
        run: python3 scripts/with_env.py prod --backend -- terraform -chdir=envs/prod init -input=false
      - name: plan
        run: |
          python3 scripts/with_env.py prod -- terraform -chdir=envs/prod plan -input=false -out=tfplan
          terraform -chdir=envs/prod show -json tfplan > "$RUNNER_TEMP/plan.json"
          python3 scripts/plan_summary.py "$RUNNER_TEMP/plan.json" --title "Prod apply" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/plan.json"
      - name: apply
        run: python3 scripts/with_env.py prod -- terraform -chdir=envs/prod apply -input=false tfplan
      - name: promotion event
        if: always()
        run: |
          version=$(grep -oE 'ref=obs-v[0-9]+\.[0-9]+\.[0-9]+' envs/prod/main.tf | cut -d= -f2 || true)
          outcome=${{ job.status == 'success' && 'success' || 'failure' }}
          # Lead time: the promotion starts at the earliest commit to modules/ that this release brings to prod
          # (since the ref it replaces), so the event's duration_s is first commit to prod apply. The first promotion
          # (no ref to replace) and a push that does not bring the ref change (tfvars only) carry no lead time.
          lead=()
          if [ -n "$version" ]; then
            git fetch --quiet --tags --unshallow origin || git fetch --quiet --tags origin || true
            bump=$(git log -1 --format=%H -G 'ref=obs-v[0-9]' -- envs/prod/main.tf || true)
            previous=$(git show "${bump}^:envs/prod/main.tf" 2>/dev/null | grep -oE 'ref=obs-v[0-9]+\.[0-9]+\.[0-9]+' | cut -d= -f2 || true)
            if [ "${{ github.event_name }}" = push ] && git merge-base --is-ancestor "$bump" "${{ github.event.before }}" 2>/dev/null; then previous=""; fi
            if [ -n "$previous" ]; then
              first=$(git log --format=%at "${previous}..${version}" -- modules 2>/dev/null | sort -n | head -n 1)
              if [ -n "$first" ]; then lead=(--started-at "$(date -u -d "@$first" +%Y-%m-%dT%H:%M:%S.000Z)"); fi
            fi
          fi
          python3 scripts/emit_event.py --action promotion --env prod --outcome "$outcome" "${lead[@]}" --bundle-version "${version:-local}" || true
