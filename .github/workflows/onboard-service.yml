name: onboard-service

on:
  issues:
    types: [opened, labeled, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number of an "Onboard a service" form
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: onboard-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'onboard-service')
    runs-on: ubuntu-latest
    env:
      # A personal token, so the pull request it opens runs the pr workflow (GITHUB_TOKEN events do not).
      GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_DISPATCH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: render the catalog entry
        id: render
        run: |
          gh issue view "$ISSUE" --json body --jq .body > "$RUNNER_TEMP/body.md"
          name=$(python3 scripts/onboard_service.py "$RUNNER_TEMP/body.md")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: open or update the pull request
        run: |
          name="${{ steps.render.outputs.name }}"
          branch="onboard/$name"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add "modules/bundle/catalog/services/$name.yaml"
          git commit -m "Onboard service: $name" -m "From issue #$ISSUE."
          git push --force origin "$branch"
          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" --title "Onboard service: $name" --label onboard-service \
              --body "Adds \`$name\` to the service catalog. The golden path gives it a dashboard, SLOs, alerting, response routing and a release gate in dev when this merges, and in prod on the next promotion.

          Closes #$ISSUE"
          fi
          gh issue comment "$ISSUE" --body "Opened pull request for \`$name\`: $(gh pr view "$branch" --json url --jq .url)"
